<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>Page Title</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
  <script src='main.js'></script>
  <style>
    ul {
  width: 100%;
  height: 100%;
  color: aqua;
  overflow: hidden;
}

li {
  float: left;
  width: 30%;
  height: 30%;
  margin-right: 5%;
  margin-bottom: 5%;
}

li:nth-of-type(3n){ 
  margin-right: 0;
}

li:nth-of-type(n+7){ 
  margin-bottom: 0;
}
  </style>

</head>


<body>
  <div class="box">
    <ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
    <li>4</li>
    <li>5</li>
    <li>6</li>
    <li>7</li>
    <li>8</li>
    <li>9</li>
    </ul>
    </div>
</body>

<script>
    var deb = function(fn, delay){
        var timer = null;
        return function (){
            var _this = this;
            var arg = arguments;
            if (timer){
                clearTimeout(timer)
            }
            timer = setTimeout(function(){
                fn.apply(_this, arg)
            }, delay);
        }

    }

    
</script>
</html>
